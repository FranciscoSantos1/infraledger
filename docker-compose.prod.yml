services:
  api:
    image: 564907679931.dkr.ecr.eu-west-1.amazonaws.com/infraledger-api:latest
    container_name: infraledger-api
    restart: always
    expose:
      - "5000"
    environment:
      DATABASE_URL: postgresql://infraledger:${DB_PASSWORD}@infraledger-db.chsaq4yccf5r.eu-west-1.rds.amazonaws.com:5432/infraledger
      AWS_REGION: eu-west-1
      AWS_PRICING_API_REGION: us-east-1

  nginx:
    image: nginx:alpine
    container_name: infraledger-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
