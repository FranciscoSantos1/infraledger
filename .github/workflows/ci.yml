name: CI

on:
  push:
    branches: [main, master]
  pull_request: [main, master]

jobs:
  # catch style/ syntax issues fast, before wasting time in slower steps
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
        python-version: "3.12"

      - name: Install ruff
      - run: pip install ruff
    
      - name: Run ruff
        run: ruff check api/
  # will run the pytest tests
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: api
        env:
          TEST_DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest -v

  


