apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraledger-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infraledger-api
  template:
    metadata:
      labels:
        app: infraledger-api
    spec:
      containers:
        - name: api
          image: 564907679931.dkr.ecr.eu-west-1.amazonaws.com/infraledger-api:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infraledger-db-secret
                  key: DATABASE_URL
            - name: AWS_REGION
              value: "eu-west-1"
            - name: AWS_PRICING_API_REGION
              value: "us-east-1"